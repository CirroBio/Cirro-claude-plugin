[project]
name = "cirro-agent"
version = "0.8.0"
description = "Agent-facing interface to the Cirro data platform"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cirro>=1.13.1,<2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "respx>=0.21",
    "flake8>=7",
]

[project.scripts]
cirro-agent = "cirro_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirro_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
