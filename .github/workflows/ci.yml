# Every safety property of this plugin is a test: the docs drift guard, the check
# that no SDK write method is ungated, the runtime contract against the pinned
# cirro-api-client, the hook's digest agreement with plans.py. None of them protect
# anything unless they run without anyone remembering to run them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new cirro or cirro-api-client release that breaks the pinned
    # contract is caught by test_runtime_contract.py rather than by a user.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Put the runtime outside the checkout
        # A directory marketplace copies the plugin root verbatim into every install,
        # so a virtualenv in the tree ships with the plugin. Setting the path
        # explicitly also means the resolvers and the runner agree here without
        # depending on what HOME happens to be on the runner. It is set from a step
        # rather than jobs.<id>.env because the runner context is not readable there.
        run: echo "CIRRO_AGENT_PLUGIN_DATA=$RUNNER_TEMP/cirro-agent" >> "$GITHUB_ENV"

      # A third-party action is pinned to a commit, not a tag: a tag can be moved to
      # point at other code after this file is written.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.5.16"

      - name: Build the pinned runtime
        run: UV_PROJECT_ENVIRONMENT="$CIRRO_AGENT_PLUGIN_DATA/dev-venv" uv sync --locked --python 3.12 --project runtime --group dev

      - name: Lint
        run: |
          "$CIRRO_AGENT_PLUGIN_DATA/dev-venv/bin/python" -m flake8 python/src python/tests scripts/gate.py

      - name: Test
        # The coverage floor is a ratchet, not a target: it sits just under the
        # measured figure so a change that drops coverage fails, and it only moves up.
        run: PYTHONPATH=python/src "$CIRRO_AGENT_PLUGIN_DATA/dev-venv/bin/python" -m pytest python/tests -q --cov=cirro_agent --cov-report=term-missing:skip-covered --cov-fail-under=80

      - name: The gate runs without the virtualenv
        # scripts/gate.py is a PreToolUse hook and must work with a bare system Python;
        # it is what earns the "no bypass through Bash" claim.
        run: python3 -c "import ast, sys; ast.parse(open('scripts/gate.py').read()); print('gate parses under', sys.version)"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate the plugin manifest
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./
