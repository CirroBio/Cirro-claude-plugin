# The user documentation, published to GitHub Pages by .github/workflows/docs.yml.
# Build outside the checkout (--site-dir): a directory marketplace copies the plugin root
# verbatim into every install, so a built site/ left here would ship with the plugin.
site_name: Cirro plugin for Claude Code
site_description: Work with your data on Cirro by asking Claude, using your own Cirro identity.
repo_url: https://github.com/CirroBio/Cirro-claude-plugin
repo_name: CirroBio/Cirro-claude-plugin
edit_uri: edit/main/docs/
exclude_docs: requirements.txt

nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Signing in: signing-in.md
      - Troubleshooting: troubleshooting.md
  - Using it:
      - Looking at things: reading.md
      - Making changes: changes.md
      - Approving a kind of change: grants.md
      - Working with sheets: sheets.md
      - Building dashboards: dashboards.md
      - Adding a pipeline: pipelines.md
  - Trust and safety:
      - How it works: how-it-works.md
      - Status: status.md
      - Locking it down: locking-down.md
  - Reference:
      - Skills and tools: skills-and-tools.md
      - Words you will see: glossary.md

theme:
  name: material
  logo: img/logo-cirro.png
  favicon: img/favicon.ico
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  # The header and palette match the Cirro App Kit site; assets/cirro.css is its copy.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter

extra_css:
  - assets/cirro.css
  - assets/hover-diagram.css

extra_javascript:
  - assets/hover-diagram.js

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
